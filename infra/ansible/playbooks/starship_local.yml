---
- name: Deploy OrchWiz Local Starship Build on Local Kubernetes
  hosts: local
  gather_facts: false
  vars:
    terraform_dir: "{{ lookup('env', 'TF_DIR') | default('../../terraform/environments/starship-local', true) }}"
    infrastructure_kind: "{{ lookup('env', 'INFRASTRUCTURE_KIND') | default('kind', true) }}"
    kube_context_override: "{{ lookup('env', 'KUBE_CONTEXT') | default('', true) }}"
    orchwiz_namespace: "{{ lookup('env', 'ORCHWIZ_NAMESPACE') | default('orchwiz-starship', true) }}"
    app_name: "{{ lookup('env', 'ORCHWIZ_APP_NAME') | default('orchwiz', true) }}"
    tf_var_openclaw_station_count: "{{ lookup('env', 'TF_VAR_openclaw_station_count') | default('', true) }}"
    tf_var_app_image: "{{ lookup('env', 'TF_VAR_app_image') | default('', true) }}"
    tf_var_provider_proxy_image: "{{ lookup('env', 'TF_VAR_provider_proxy_image') | default('', true) }}"
    tf_var_app_env: "{{ lookup('env', 'TF_VAR_app_env') | default('', true) }}"
    tf_var_runtime_jwt_secret: "{{ lookup('env', 'TF_VAR_runtime_jwt_secret') | default('', true) }}"
    tf_var_enable_grafana: "{{ lookup('env', 'TF_VAR_enable_grafana') | default('', true) }}"
    tf_var_enable_prometheus: "{{ lookup('env', 'TF_VAR_enable_prometheus') | default('', true) }}"
    tf_var_enable_loki: "{{ lookup('env', 'TF_VAR_enable_loki') | default('', true) }}"
    tf_var_enable_clickhouse: "{{ lookup('env', 'TF_VAR_enable_clickhouse') | default('', true) }}"
    tf_var_enable_langfuse: "{{ lookup('env', 'TF_VAR_enable_langfuse') | default('', true) }}"
    terraform_cli_var_overrides: >-
      {{
        ['-var', 'infrastructure_kind=' ~ infrastructure_kind]
        + (
            (kube_context_override | length > 0)
            | ternary(['-var', 'kube_context=' ~ kube_context_override], [])
          )
        + (
            (tf_var_openclaw_station_count | length > 0)
            | ternary(['-var', 'openclaw_station_count=' ~ tf_var_openclaw_station_count], [])
          )
        + (
            (tf_var_app_image | length > 0)
            | ternary(['-var', 'app_image=' ~ tf_var_app_image], [])
          )
        + (
            (tf_var_provider_proxy_image | length > 0)
            | ternary(['-var', 'provider_proxy_image=' ~ tf_var_provider_proxy_image], [])
          )
        + (
            (tf_var_app_env | length > 0)
            | ternary(['-var', 'app_env=' ~ tf_var_app_env], [])
          )
        + (
            (tf_var_runtime_jwt_secret | length > 0)
            | ternary(['-var', 'runtime_jwt_secret=' ~ tf_var_runtime_jwt_secret], [])
          )
        + (
            (tf_var_enable_grafana | length > 0)
            | ternary(['-var', 'enable_grafana=' ~ tf_var_enable_grafana], [])
          )
        + (
            (tf_var_enable_prometheus | length > 0)
            | ternary(['-var', 'enable_prometheus=' ~ tf_var_enable_prometheus], [])
          )
        + (
            (tf_var_enable_loki | length > 0)
            | ternary(['-var', 'enable_loki=' ~ tf_var_enable_loki], [])
          )
        + (
            (tf_var_enable_clickhouse | length > 0)
            | ternary(['-var', 'enable_clickhouse=' ~ tf_var_enable_clickhouse], [])
          )
        + (
            (tf_var_enable_langfuse | length > 0)
            | ternary(['-var', 'enable_langfuse=' ~ tf_var_enable_langfuse], [])
          )
      }}
    terraform_env: >-
      {{
        {
          'TF_VAR_infrastructure_kind': infrastructure_kind,
          'TF_VAR_kube_context': kube_context_override
        }
        | combine(
            (tf_var_openclaw_station_count | length > 0)
            | ternary({'TF_VAR_openclaw_station_count': tf_var_openclaw_station_count}, {})
          )
        | combine(
            (tf_var_app_image | length > 0)
            | ternary({'TF_VAR_app_image': tf_var_app_image}, {})
          )
        | combine(
            (tf_var_provider_proxy_image | length > 0)
            | ternary({'TF_VAR_provider_proxy_image': tf_var_provider_proxy_image}, {})
          )
        | combine(
            (tf_var_app_env | length > 0)
            | ternary({'TF_VAR_app_env': tf_var_app_env}, {})
          )
        | combine(
            (tf_var_runtime_jwt_secret | length > 0)
            | ternary({'TF_VAR_runtime_jwt_secret': tf_var_runtime_jwt_secret}, {})
          )
        | combine(
            (tf_var_enable_grafana | length > 0)
            | ternary({'TF_VAR_enable_grafana': tf_var_enable_grafana}, {})
          )
        | combine(
            (tf_var_enable_prometheus | length > 0)
            | ternary({'TF_VAR_enable_prometheus': tf_var_enable_prometheus}, {})
          )
        | combine(
            (tf_var_enable_loki | length > 0)
            | ternary({'TF_VAR_enable_loki': tf_var_enable_loki}, {})
          )
        | combine(
            (tf_var_enable_clickhouse | length > 0)
            | ternary({'TF_VAR_enable_clickhouse': tf_var_enable_clickhouse}, {})
          )
        | combine(
            (tf_var_enable_langfuse | length > 0)
            | ternary({'TF_VAR_enable_langfuse': tf_var_enable_langfuse}, {})
          )
      }}

  tasks:
    - name: Validate infrastructure kind
      ansible.builtin.assert:
        that:
          - infrastructure_kind in ['kind', 'minikube']
        fail_msg: "infrastructure_kind must be one of: kind, minikube."

    - name: Check prerequisites
      ansible.builtin.command: "which {{ item }}"
      loop:
        - terraform
        - kubectl
      changed_when: false

    - name: Check Minikube CLI when Minikube is selected
      ansible.builtin.command: which minikube
      changed_when: false
      when: infrastructure_kind == "minikube"

    - name: Terraform init
      ansible.builtin.command: terraform -chdir={{ terraform_dir }} init -backend=false
      changed_when: false
      environment: "{{ terraform_env }}"

    - name: Terraform plan
      ansible.builtin.command:
        argv: "{{ ['terraform', '-chdir=' ~ terraform_dir, 'plan'] + terraform_cli_var_overrides + ['-out=tfplan'] }}"
      changed_when: false
      environment: "{{ terraform_env }}"

    - name: Terraform apply
      ansible.builtin.command: terraform -chdir={{ terraform_dir }} apply -auto-approve tfplan
      environment: "{{ terraform_env }}"

    - name: Wait for deployment rollout
      ansible.builtin.command: kubectl -n {{ orchwiz_namespace }} rollout status deploy/{{ app_name }} --timeout=300s
      changed_when: false

    - name: Resolve local access URL for Minikube
      ansible.builtin.command: minikube service -n {{ orchwiz_namespace }} {{ app_name }} --url
      register: starship_url
      changed_when: false
      when: infrastructure_kind == "minikube"

    - name: Print local access URL for Minikube
      ansible.builtin.debug:
        msg: "Local Starship endpoint: {{ starship_url.stdout }}"
      when: infrastructure_kind == "minikube"

    - name: Print local access command for KIND
      ansible.builtin.debug:
        msg: "Local Starship endpoint: kubectl -n {{ orchwiz_namespace }} port-forward svc/{{ app_name }} 3000:3000 (then open http://localhost:3000)"
      when: infrastructure_kind == "kind"
