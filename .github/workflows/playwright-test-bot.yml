name: Playwright Test Bot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - node/**
      - .github/workflows/playwright-test-bot.yml
  push:
    branches:
      - main
    paths:
      - node/**
      - .github/workflows/playwright-test-bot.yml

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orchwiz
          POSTGRES_PASSWORD: orchwiz_ci
          POSTGRES_DB: orchwiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchwiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run test bot against local app
        env:
          ORCHWIZ_BOT_BASE_URL: http://127.0.0.1:3000
          PW_REPORT_DIR: /home/runner/work/orchwiz/orchwiz/node/output/playwright
          NODE_ENV: production
          DATABASE_URL: postgresql://orchwiz:orchwiz_ci@localhost:5432/orchwiz?schema=public
          BETTER_AUTH_SECRET: playwright-test-bot-secret-min-32-chars
        run: |
          set -e
          cleanup() { [ -n "${APP_PID-}" ] && { kill $APP_PID 2>/dev/null || true; wait $APP_PID 2>/dev/null || true; }; }
          trap cleanup EXIT

          if [ -f .env.example ]; then
            cp .env.example .env
          fi

          npm run db:generate
          npm run build
          echo "Build completed."

          (npm run start >orchwiz-app.log 2>&1 & echo $! > .orchwiz-app.pid)
          APP_PID=$(cat .orchwiz-app.pid)
          APP_READY=0

          for attempt in $(seq 1 90); do
            if curl -fsS "$ORCHWIZ_BOT_BASE_URL" >/dev/null; then
              APP_READY=1
              break
            fi
            if [ ! -d /proc/$APP_PID ]; then
              echo "app process exited before it became ready"
              echo "--- app log ---"
              cat orchwiz-app.log
              exit 1
            fi
            sleep 2
          done

          if [ "$APP_READY" != "1" ]; then
            echo "app did not become ready before timeout"
            echo "--- app log ---"
            cat orchwiz-app.log
            kill $APP_PID || true
            wait $APP_PID || true
            exit 1
          fi

          if [ ! -d /proc/$APP_PID ]; then
            echo "app process exited before tests"
            echo "--- app log ---"
            cat orchwiz-app.log
            exit 1
          fi
          echo "App is ready."

          echo "Running Playwright smoke tests..."
          if ! npm run test:bot:ci; then
            BOT_EXIT_CODE=$?
            echo "Tests failed. App log:"
            cat orchwiz-app.log
          else
            BOT_EXIT_CODE=0
          fi

          exit ${BOT_EXIT_CODE:-1}
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-bot-artifacts
          path: node/output/playwright/
          if-no-files-found: ignore

      - name: Upload app log on failure
        if: failure() && hashFiles('node/orchwiz-app.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: orchwiz-app-log
          path: node/orchwiz-app.log
