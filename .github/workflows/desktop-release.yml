name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build:
    name: Build Installers (${{ matrix.os }})
    needs: create_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            node/package-lock.json
            desktop/package-lock.json

      - name: Resolve Version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node App Deps
        working-directory: node
        run: npm ci

      - name: Generate Prisma Client (Dummy DB URL)
        working-directory: node
        env:
          DATABASE_URL: postgresql://orchwiz:orchwiz_dev@localhost:5432/orchis?schema=public
        run: npm run db:generate

      - name: Build Node App
        working-directory: node
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://orchwiz:orchwiz_dev@localhost:5432/orchis?schema=public
          BETTER_AUTH_SECRET: desktop-release-build
          BETTER_AUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Install Desktop Deps
        working-directory: desktop
        run: npm ci

      - name: Set Desktop Version
        working-directory: desktop
        shell: bash
        run: npm version --no-git-tag-version "${{ steps.ver.outputs.version }}"

      - name: Build Desktop Installers
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            desktop/dist-app/OrchWiz-Desktop-*.dmg
            desktop/dist-app/OrchWiz-Desktop-*.exe
            desktop/dist-app/OrchWiz-Desktop-*.tar.gz

