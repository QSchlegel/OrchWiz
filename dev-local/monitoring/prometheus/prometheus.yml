global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3001

  - job_name: ship-service-metrics
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: "__PROMETHEUS_METRICS_BEARER_TOKEN__"
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: app
      - targets:
          - host.docker.internal:3100
        labels:
          service: runtime-edge
      - targets:
          - host.docker.internal:4000
        labels:
          service: provider-proxy

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - host.docker.internal:9115

  - job_name: ship-service-probes
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://host.docker.internal:3000/api/health
        labels:
          service: app
      - targets:
          - http://host.docker.internal:3100/health
        labels:
          service: runtime-edge
      - targets:
          - http://host.docker.internal:4000/health
        labels:
          service: provider-proxy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [service]
        target_label: service
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9115
