services:
  postgres:
    image: postgres:15-alpine
    container_name: orchwiz-postgres-dev-local
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchwiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchwiz_dev}
      POSTGRES_DB: ${POSTGRES_DB:-orchis}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchwiz} -d ${POSTGRES_DB:-orchis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-lightning-store:
    build:
      context: ../services/agent-lightning-store
    container_name: orchwiz-agent-lightning-store-dev-local
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.00"
    ports:
      - "4747:4747"

  wallet-enclave:
    build:
      context: ../services/wallet-enclave
    container_name: orchwiz-wallet-enclave-dev-local
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    ports:
      - "127.0.0.1:3377:3377"
    env_file:
      - ../services/wallet-enclave/.env
    environment:
      WALLET_ENCLAVE_HOST: "0.0.0.0"
      WALLET_ENCLAVE_PORT: "3377"
      WALLET_ENCLAVE_DATA_DIR: "/data"
    volumes:
      - wallet_enclave_data_local:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3377/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  spacebot:
    build:
      context: ../services/spacebot
      target: slim
    container_name: orchwiz-spacebot-dev-local
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    environment:
      WEBHOOK_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - spacebot_data_local:/data

volumes:
  postgres_data_local:
    driver: local
  wallet_enclave_data_local:
    driver: local
  spacebot_data_local:
    driver: local
