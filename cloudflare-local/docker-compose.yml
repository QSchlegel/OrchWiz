version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: orchwiz-postgres
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchwiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-orchis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchwiz} -d ${POSTGRES_DB:-orchis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchwiz-network

  agent-lightning-store:
    build:
      context: ../services/agent-lightning-store
    container_name: orchwiz-agent-lightning-store
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.00"
    networks:
      - orchwiz-network

  spacebot:
    build:
      context: ../services/spacebot
      target: slim
    container_name: orchwiz-spacebot
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    environment:
      WEBHOOK_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - spacebot_data:/data
    networks:
      - orchwiz-network

  nextjs:
    build:
      context: ../node
      dockerfile: Dockerfile
    image: orchwiz-control-plane:latest
    container_name: orchwiz-nextjs
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1.50"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orchwiz}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-orchis}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://nextjs:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      AGENT_LIGHTNING_STORE_URL: http://agent-lightning-store:4747
      SPACEBOT_WEBHOOK_BASE_URL: http://spacebot:18789
      RUNTIME_ADAPTER_REGISTRY_ENABLED: ${RUNTIME_ADAPTER_REGISTRY_ENABLED:-false}
      BRIDGE_DISPATCH_REGISTRY_ENABLED: ${BRIDGE_DISPATCH_REGISTRY_ENABLED:-false}
      TOOLCHAIN_PROTOCOL_REGISTRY_ENABLED: ${TOOLCHAIN_PROTOCOL_REGISTRY_ENABLED:-false}
      SPACEBOT_CONNECTOR_ENABLED: ${SPACEBOT_CONNECTOR_ENABLED:-false}
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>r.json()).then(d=>process.exit(d.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - orchwiz-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: orchwiz-cloudflared
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    depends_on:
      - nextjs
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - orchwiz-network
    # If using tunnel token, cloudflared will auto-detect the tunnel
    # The config file is still used for ingress rules

volumes:
  postgres_data:
    driver: local
  spacebot_data:
    driver: local

networks:
  orchwiz-network:
    driver: bridge
